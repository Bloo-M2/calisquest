// ---------- fitness model ----------
const bmi=()=>st.prof.w/Math.pow(st.prof.h/100,2);
function mult(){const p=st.prof;let m={beginner:.8,intermediate:1,advanced:1.15}[p.exp]||1;
 m*=p.age<30?1:p.age<45?.95:p.age<60?.85:.7;const b=bmi();m*=b<25?1:b<30?.92:b<35?.82:.7;return Math.max(.45,Math.min(1.2,m));}
const restSec=()=>st.prof.age>=45?90:60;
const levelName=()=>{const m=mult();return m>=1.05?'Strong start':m>=.85?'Solid base':m>=.65?'Building phase':'Gentle start'};
const rank=()=>RANKS[Math.min(RANKS.length-1,Math.floor(st.idx/4.2))];
function sc(r,m){const x=/^(\d+)(.*)$/.exec(r);return x?Math.max(1,Math.round(x[1]*m))+x[2]:r}
function parseEx(s,m,tag){const [n,sets,reps]=s.split('|');let S=+sets;if(tag==='sup'&&m<.7&&S>=3)S--;return{n,sets:S,reps:sc(reps,m)}}
function exMin(e,r){let w=10;const x=/^(\d+)\s*(s|min)?/.exec(e.reps);if(x){w=x[2]==='s'?+x[1]:x[2]==='min'?+x[1]*60:+x[1]*3.5}const per=/side/.test(e.reps)?2:1;return e.sets*(w*per+r)/60}
function fill(list,b,r,minN){const o=[];let u=0;for(const e of list){const t=exMin(e,r);if(o.length>=minN&&u+t>b)continue;o.push(e);u+=t;if(u>=b&&o.length>=minN)break}return o}
const lbl={push:'Push',pull:'Pull',quads:'Quads',post:'Glutes & Hamstrings',core:'Core',delts:'Shoulders',arms:'Arms',calves:'Calves'};

function build(){
 const wd=new Date().getDay(),plan=DAYS[wd],ci=st.checkin[dk()];if(!ci)return null;
 const T=ci.time;const m=mult()*(ci.energy==='low'?.85:ci.energy==='high'?1.05:1);const R=restSec(),eq=st.equip,sk=SKILLS[st.idx];
 const out={plan,T,m,blocks:[],wd};
 if(plan.tag==='rest'){
  const f=FLEX[0],cnt=Math.min(f.items.length,Math.max(3,Math.round(T/1.8)));
  out.blocks.push({id:'flow',title:'Flexibility Flow: '+f.focus,min:T,items:f.items.slice(0,cnt).map(x=>{const[n,r]=x.split('|');return{n,reps:r}})});
  return out}
 const warm=T<25?4:T<45?6:8,cool=T<25?3:T<45?5:8;
 let w=[...new Set([...(WARM[plan.tag]||[]),...WARM.base])].slice(0,Math.max(3,warm));
 out.blocks.push({id:'warm',title:'Warm-up & Mobility',min:warm,items:w.map(x=>{const[n,r]=x.split('|');return{n,reps:r}})});
 const main=T-warm-cool,skMin=Math.round(main*(plan.skillBoost?.55:.35)),ms=(1+m)/2;
 const drills=fill((eq==='gym'?sk.g:sk.f).map(s=>parseEx(s,ms)),skMin,90,skMin>=10?2:1);
 out.blocks.push({id:'skill',title:'Skill Work: '+sk.n,min:skMin,items:drills,rest:90});
 const tier=Math.max(0,Math.min(5,Math.floor(st.idx/5.5)-(m<.75?1:0)));
 const names=new Set(drills.map(d=>d.n)),cand=[];
 for(let pass=0;pass<2;pass++)for(const p of plan.pat){const a=POOL[p][eq];let t=pass===0?tier:(tier>0?tier-1:1);t=Math.min(t,a.length-1);const e=parseEx(a[t],m,'sup');if(names.has(e.n))continue;names.add(e.n);e.tag=lbl[p];cand.push(e)}
 const sup=fill(cand,main-skMin,R,2);
 out.blocks.push({id:'str',title:'Strength & Aesthetics',min:main-skMin,items:sup,rest:R});
 const f=FLEX[wd],cnt=Math.max(2,Math.round(cool/1.5));
 out.blocks.push({id:'cool',title:'Flexibility Cool-down: '+f.focus,min:cool,items:f.items.slice(0,cnt).map(x=>{const[n,r]=x.split('|');return{n,reps:r}})});
 return out}

function nutKey(plan,ci){if(plan.intensity==='rest')return'rest';if(!ci)return plan.intensity;if(ci.time<=20||ci.energy==='low')return'light';return plan.intensity}
function log(){const k=dk();return st.logs[k]=st.logs[k]||{done:[],fin:false}}
function streak(){let s=0,d=new Date();if(!(st.logs[dk(d)]||{}).fin)d.setDate(d.getDate()-1);while((st.logs[dk(d)]||{}).fin){s++;d.setDate(d.getDate()-1)}return s}
function tests(){const k=SKILLS[st.idx].n;return st.tests[k]=st.tests[k]||[false,false,false]}
function tips(sk){const t=[],b=bmi(),p=st.prof;
 if(b>=28&&['pull','push','mixed','balance'].includes(sk.c))t.push('Higher bodyweight makes lever, planche and pulling skills harder. Progress will be slower at first, and that is normal. Strength-to-weight improves fast as you train and eat well.');
 if(p.h>=188)t.push('Tall frame means longer levers. Stay on tuck and advanced-tuck variations a bit longer than the guides say.');
 if(p.h<=165&&['pull','push'].includes(sk.c))t.push('Shorter levers are an advantage on planche and levers. Use it.');
 if(p.age>=40)t.push('Extra warm-up time is built in. Keep straight-arm skills (levers, planche) to 2 to 3 sessions a week, and listen to elbows and shoulders.');
 if(p.age<18)t.push('Keep reps clean and skip max-effort attempts. Stop sets with 1 to 2 reps in reserve.');
 if(st.equip==='floor'&&['pull','mixed'].includes(sk.c))t.push('Floor mode: pulling drills use doorframe towel rows, tables and floor proxies. Test this skill on any real bar (playground, tree branch) when you can, or switch to Gym mode.');
 return t}
